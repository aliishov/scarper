<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; color: #17212b; background: #ffffff; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0; }
    label { display: block; margin: 10px 0 5px; font-weight: 600; }
    input[type="text"], input[type="password"], input[type="number"], textarea, select { width: 100%; border: 1px solid #b8c3cc; border-radius: 4px; padding: 8px; color: inherit; background: #fff; font: inherit; }
    textarea { min-height: 88px; resize: vertical; }
    .check { display: flex; gap: 7px; align-items: flex-start; font-weight: 500; }
    .check input { margin-top: 3px; }
    .auth { margin-top: 10px; padding: 10px 0; border-top: 1px solid #e3e8ec; }
    .date-control { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 6px; }
    .date-control input { margin: 0; }
    #datePicker { width: 44px; min-width: 44px; color: transparent; padding: 7px 5px; cursor: pointer; }
    #datePicker::-webkit-datetime-edit { display: none; }
    #datePicker::-webkit-calendar-picker-indicator { margin: 0; width: 24px; height: 24px; cursor: pointer; opacity: 1; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    button { min-height: 38px; border: 0; border-radius: 4px; padding: 8px 12px; color: #fff; background: #1478c8; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    #stop { background: #c42b36; }
    #skip { grid-column: 1 / -1; background: #a96500; }
    #status { margin-top: 12px; color: #485866; font-weight: 600; }
    #error { display: none; margin-top: 8px; padding: 8px; border-left: 3px solid #c42b36; color: #971c26; background: #fff3f4; }
    #logs { height: 280px; margin-top: 6px; overflow: auto; border: 1px solid #d7dfe5; border-radius: 4px; padding: 8px; background: #f7f9fa; font: 11px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .log-warn { color: #8a5600; }
    .log-error { color: #b01825; }
    .muted { color: #647582; font-size: 12px; font-weight: 400; }
  </style>
</head>
<body>
  <header>
    <h1>Multi-platform scraper</h1>
    <select id="langSelect" aria-label="Language" style="width:72px">
      <option value="ru">RU</option>
      <option value="az">AZ</option>
    </select>
  </header>

  <label for="platform" data-i18n="socialNetwork">Социальная сеть</label>
  <select id="platform">
    <option value="twitter">X (Twitter)</option>
    <option value="facebook">Facebook</option>
    <option value="instagram">Instagram</option>
    <option value="tiktok">TikTok</option>
    <option value="oxu.az">Oxu.az</option>
    <option value="media.az">Media.az</option>
  </select>

  <label for="keywords" data-i18n="keywords">Ключевые слова, каждое с новой строки</label>
  <textarea id="keywords" placeholder="Messi&#10;FIFA"></textarea>

  <label class="check"><input type="checkbox" id="limitCountToggle" checked><span data-i18n="maxPosts">Ограничить количество постов на слово</span></label>
  <input type="number" id="count" value="10" min="1" step="1">

  <label class="check"><input type="checkbox" id="infiniteLoopToggle"><span data-i18n="infiniteLoop">Бесконечный сбор</span></label>
  <label class="check"><input type="checkbox" id="dateLimitToggle"><span data-i18n="dateLimit">Не собирать посты старше даты</span></label>
  <div class="date-control">
    <input type="text" id="dateLimit" placeholder="DD/MM/YYYY" inputmode="numeric" maxlength="10" autocomplete="off" disabled>
    <input type="date" id="datePicker" aria-label="Выбрать дату в календаре" title="Выбрать дату в календаре" disabled>
  </div>

  <label class="check"><input type="checkbox" id="sendToServerToggle" checked><span data-i18n="sendToServer">Отправлять посты на сервер</span></label>
  <label class="check"><input type="checkbox" id="saveToPCToggle" checked><span data-i18n="saveToPC">Сохранять результаты в JSONL на ПК</span></label>

  <section id="authFields" class="auth">
    <div class="muted" data-i18n="auth">Данные входа используются только в текущей сессии браузера</div>
    <label for="authUsername" data-i18n="username">Логин или email</label>
    <input type="text" id="authUsername" autocomplete="off">
    <label for="authPassword" data-i18n="password">Пароль</label>
    <input type="password" id="authPassword" autocomplete="new-password">
  </section>

  <div id="error" role="alert"></div>
  <div id="status" data-i18n="ready">Готов к запуску</div>

  <div class="actions">
    <button id="start" data-i18n="start">Начать сбор</button>
    <button id="stop" data-i18n="stop" hidden>Остановить</button>
    <button id="skip" data-i18n="skip" hidden>Следующее слово</button>
  </div>

  <label for="logs" data-i18n="logs">Логи</label>
  <div id="logs"></div>

  <script src="core/namespace.js"></script>
  <script src="core/utils.js"></script>
  <script src="core/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
